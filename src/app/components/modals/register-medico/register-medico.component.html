<div class="modal-header border-bottom pb-3">
  <h4 class="modal-title">Registrar médico</h4>
  <button type="button" class="close btn-icon" (click)="ngbActiveModal.close()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>

<form [formGroup]="createMedicoForm" (ngSubmit)="createMedico()">
  <div class="modal-body">

    <label class="label-section mb-2">Información General</label>

    <div class="row">
      <!-- START ROW -->
      <div class="col-12 col-sm-6">
        <div class="form-group">
          <label class="label-section mb-0">Nombre</label>
          <input formControlName="names" [class]="formSubmited && createMedicoForm.get('names')?.invalid?'is-invalid':''" type="text" class="form-control" placeholder="Nombre del médico">
          <div *ngIf="formSubmited && createMedicoForm.get('names')?.invalid" class="invalid-feedback">{{getErrorMessageName()}}</div>
        </div>
      </div>
      <!-- END ROW -->
      <!-- START ROW -->
      <div class="col-12 col-sm-6">
        <div class="form-group">
          <label class="label-section mb-0 ">Apellidos</label>
          <input formControlName="last_names" [class]="formSubmited && createMedicoForm.get('last_names')?.invalid?'is-invalid':''" type="text" class="form-control" placeholder="Apellidos del médico">
          <div *ngIf="formSubmited && createMedicoForm.get('last_names')?.invalid" class="invalid-feedback">{{getErrorMessageName()}}</div>
        </div>
      </div>
      <!-- START ROW -->
      <div class="col-12 col-sm-6">
        <div class="form-group">
          <label class="label-section mb-0 ">Correo</label>
          <input formControlName="email" [class]="formSubmited && createMedicoForm.get('email')?.invalid?'is-invalid':''" type="text" class="form-control" placeholder="Correo electrónico">
          <div *ngIf="formSubmited && createMedicoForm.get('email')?.invalid" class="invalid-feedback">{{getErrorMessageEmail()}}</div>
        </div>
      </div>

      <div class="col-12 col-sm-6 ">
        <label class="label-section mb-0 ">Documento</label>
        <div class="input-group d-flex justify-content-center justify-content-md-start">

          <div ngbDropdown class="d-inline-block custom-dropdawn" container="body" >
            <button
              type="button"
              class="btn p-2"
              style="
                  background-color: #f6f6f6;
                  height: 100%;
                  border:1px solid #E4E4E4 !important;
                  border-right: none !important;
              "
              (click)="isOpenDropdown = !isOpenDropdown"
              id="registerMedicoChangeCountryCode"
              ngbDropdownToggle
              [class]="
                  formSubmited && getControl('typeDocument')?.invalid
                  ? 'is-invalid'
                  : ''
              "
            >
              {{ getControl("typeDocument")?.value }}
              <i
                  class="fas ml-2"
                  [ngClass]="{
                  'fa-chevron-up': isOpenDropdown,
                  'fa-chevron-down': !isOpenDropdown
                  }"
              ></i>
            </button>
            <div ngbDropdownMenu>
              <ng-container *ngFor="let item of typesDocuments">
                <button
                  ngbDropdownItem
                  [ngClass]="{
                      selected: item === getControl('typeDocument')?.value
                  }"
                  (click)="updateTypeDocument(item)"
                >
                  {{ item }}
                </button>
              </ng-container>
            </div>
          </div>
          <input
            *ngIf="getControl('typeDocument')?.value === 'DUI'"
            formControlName="identityNumber"
            [class]=" createMedicoForm.get('identityNumber')?.invalid && formSubmited ? 'is-invalid' : ''"
            mask="00000000-0"
            type="text"
            name="identityNumber"
            aria-label="RNP"
            placeholder="Número de identidad"
            class="form-control form-input-auth"
          />

          <input
            *ngIf="getControl('typeDocument')?.value === 'Pasaporte'"
            formControlName="passport"
            [class]="
              createMedicoForm.get('passport')?.invalid && formSubmited
                  ? 'is-invalid'
                  : ''
              "
            type="text"
            name="passport"
            [placeholder]="'Pasaporte'"
            class="form-control"
          />

          <input
            *ngIf="getControl('typeDocument')?.value === 'ID internacional'"
            formControlName="idInternacional"
            [class]="
              createMedicoForm.get('idInternacional')?.invalid && formSubmited
                  ? 'is-invalid'
                  : ''
              "
            type="text"
            name="idInternacional"
            [placeholder]="'ID Internacional'"
            class="form-control"
          />
        </div>
        <span
          *ngIf="createMedicoForm.get('identityNumber')?.invalid && formSubmited"
          class="invalid-feedback d-block"
          >{{ getErroridentityNumberMessage() }}</span
        >
        <span
          *ngIf="createMedicoForm.get('passport')?.invalid && formSubmited"
          class="invalid-feedback d-block"
          >El pasaporte es requerido</span
        >
        <span
          *ngIf="createMedicoForm.get('idInternacional')?.invalid && formSubmited"
          class="invalid-feedback d-block"
          >El ID internacional es requerido</span
        >
      </div>
      <!-- END ROW -->
      <!-- START ROW -->
      <div class="col-12 col-sm-8 col-md-6 mb-3 mb-md-0">
        <label class="label-section mb-0">Teléfono</label>
        <div class="input-group d-flex justify-content-center justify-content-md-start">

          <div ngbDropdown class="d-inline-block" container="body">
            <button
              type="button"
              class="btn pr-0"
              style="
                background-color: #f6f6f6;
                height: 100%;
                border:1px solid #E4E4E4 !important;
                border-right: none !important;
              "
              (click)="isOpenDropdown = !isOpenDropdown"
              id="registerMedicoChangeCountryCode2"
              ngbDropdownToggle
              [class]="
                formSubmited && getControl('countryCode')?.invalid
                  ? 'is-invalid'
                  : ''
              "
            >
              {{ getControl("COICode")?.value }}
              <i
                class="fas ml-2"
                [ngClass]="{
                  'fa-chevron-up': isOpenDropdown,
                  'fa-chevron-down': !isOpenDropdown
                }"
              ></i>
            </button>
            <div ngbDropdownMenu>
              <ng-container *ngFor="let item of countries">
                <button
                  ngbDropdownItem
                  [ngClass]="{
                    selected: item.name === getControl('country')?.value
                  }"
                  (click)="
                    getControl('countryCode')?.setValue(item.countryCode);
                    getControl('country')?.setValue(item.name);
                    getControl('COICode')?.setValue(item.COICode);
                    getControl('mask')?.setValue(item.mask)
                  "
                >
                  {{ item.name }}
                </button>
              </ng-container>
            </div>
          </div>
          <input
            type="text"
            id="registerMedicoPhone"
            placeholder="9587-6543"
            class="form-control input-phone pl-1"
            formControlName="phone"
            [class]="
              formSubmited && getControl('phone')?.invalid
                ? 'is-invalid d-block'
                : ''
            "
            [allowNegativeNumbers]="false"
            [mask]="getControl('mask')?.value"
            [prefix]="getControl('countryCode')?.value + ' '"
            style=" padding-left: 1rem !important;"
          />
          <span
            *ngIf="createMedicoForm.get('phone')?.invalid && formSubmited"
            class="invalid-feedback d-block"
            >{{ getErrorMessagePhone() }}
          </span>
        </div>
      </div>
      <!-- END ROW -->
      <!-- START ROW -->
      <div class="col-12 col-sm-8 mt-3">
        <label class="label-section mb-0">Contraseña</label>
        <div class="form-group">
          <div class="input-group">
            <input formControlName="password" [class]="formSubmited && createMedicoForm.get('password')?.invalid?'is-invalid':''" [type]="showPassword?'text':'password'" class="form-control" placeholder="Contraseña" autocomplete="new-password">
            <button (click)="showPassword = !showPassword" class="btn btn-white border btn-icon" style="height: 48px !important;" type="button">
              <i [class]="showPassword?'fas fa-eye':'fas fa-eye-slash'"></i>
            </button>
          </div>
          <app-password-strength
              [passwordToCheck]="createMedicoForm.get('password')?.value"
              (passwordStrength)="onPasswordStrengthChanged($event)"
          ></app-password-strength>

          <div *ngIf="formSubmited && createMedicoForm.get('password')?.invalid" class="invalid-feedback d-block">{{getErrorMessagePassword()}}</div>
        </div>
      </div>
      <!-- END ROW -->

    </div>
  </div>

  <div class="modal-footer">
    <button type="submit" class="btn btn-primary btn-200" style="height: 56px !important;">Agregar médico</button>
  </div>
</form>
